<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo -->
  <rect width="512" height="512" rx="120" fill="#1a0840"/>
  
  <!-- Nebulosa de fondo -->
  <radialGradient id="nebula" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#9b60c8" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#1a0840" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="200" r="300" fill="url(#nebula)"/>
  
  <!-- Luna -->
  <circle cx="256" cy="200" r="100" fill="#f5e8ff" opacity="0.95"/>
  <circle cx="310" cy="175" r="90" fill="#1a0840"/>
  
  <!-- Estrella dorada -->
  <text x="256" y="390" font-size="80" text-anchor="middle" fill="#f0cc6e" font-family="serif">✦</text>
  
  <!-- Texto ÁNIMA -->
  <text x="256" y="460" font-size="52" text-anchor="middle" fill="#f5e8ff" font-family="Georgia, serif" font-weight="300" letter-spacing="8">ÁNIMA</text>
</svg>
